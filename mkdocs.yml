site_name: Steve Nesbitt
site_url: https://swnesbitt.github.io/
site_description: Steve Nesbitt - Professor & Department Head, Climate, Meteorology & Atmospheric Sciences, University of Illinois
site_author: Steve Nesbitt
repo_url: https://github.com/swnesbitt
repo_name: swnesbitt

theme:
  name: material
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  font:
    text: Source Sans Pro
    code: Source Code Pro

hooks:
  - hooks/bib_hook.py

nav:
  - Home: index.md
  - Field Campaigns: field-campaigns.md
  - Group Members: group-members.md
  - Publications: publications.md
  - Open Source Software: open-source.md
  - RELAMPAGO WRF Forecasts: relampago-wrf.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list

extra_css:
  - stylesheets/extra.css
